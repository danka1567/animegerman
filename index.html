<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovieStream - Multi-Language Servers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            font-size: 28px;
            color: #4e54c8;
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        
        .search-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 12px 15px;
            color: white;
            font-size: 16px;
            font-size: max(16px, 1em);
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .search-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .search-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .search-result {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-result:active {
            transform: scale(0.98);
        }
        
        .result-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .result-info {
            padding: 10px;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }
        
        .result-year {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .result-type {
            font-size: 11px;
            background: rgba(78, 84, 200, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .server-selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }
        
        .server-selector {
            position: relative;
            display: inline-block;
            flex: 1;
            min-width: 120px;
        }
        
        .server-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 10px 15px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            width: 100%;
            justify-content: center;
            font-size: 14px;
        }
        
        .server-button i {
            font-size: 16px;
        }
        
        .server-dropdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(-20px);
            background: rgba(30, 30, 46, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
        }
        
        .server-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) translateY(0);
        }
        
        .server-list {
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .server-item {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .server-item:active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .server-flag {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }
        
        .server-info {
            flex: 1;
            min-width: 0;
        }
        
        .server-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .server-desc {
            font-size: 11px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .episode-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .episode-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .episode-nav-title {
            font-size: 16px;
            font-weight: 600;
            color: #8f94fb;
        }
        
        .season-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }
        
        .episode-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 13px;
            min-height: 35px;
        }
        
        .episode-button:active {
            transform: scale(0.95);
        }
        
        .player-container {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            background: #000;
            position: relative;
        }
        
        .player-header {
            background: rgba(30, 30, 46, 0.9);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .movie-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .current-server {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }
        
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        
        /* Player Controls Overlay */
        .player-controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            pointer-events: none;
        }
        
        .video-wrapper:hover .player-controls-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        
        .video-wrapper.touch .player-controls-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        
        .player-controls {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .control-button:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .lock-button {
            background: rgba(255, 107, 107, 0.8);
        }
        
        .lock-button.locked {
            background: rgba(76, 175, 80, 0.8);
        }
        
        /* Lock Screen Overlay */
        .lock-screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .lock-screen-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .lock-screen-icon {
            font-size: 60px;
            color: #4e54c8;
            margin-bottom: 20px;
        }
        
        .lock-screen-message {
            font-size: 18px;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        
        .unlock-button {
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            border: none;
            border-radius: 25px;
            padding: 15px 40px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .unlock-button:active {
            transform: scale(0.95);
        }
        
        .player-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: #000;
        }
        
        .player-fullscreen .video-wrapper {
            height: 100vh;
            padding-top: 0;
        }
        
        .player-fullscreen .player-header {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 11;
            background: rgba(30, 30, 46, 0.95);
        }
        
        .player-fullscreen .player-controls-overlay {
            z-index: 11;
        }
        
        .player-fullscreen .lock-screen-overlay {
            z-index: 12;
        }
        
        .server-notice {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #8f94fb;
        }
        
        .error-message {
            text-align: center;
            padding: 15px;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .database-info {
            text-align: center;
            padding: 10px;
            background: rgba(78, 84, 200, 0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.4;
        }
        
        /* URL Modal Styles */
        .url-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .url-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .url-modal-content {
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            width: 95%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .url-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .url-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #8f94fb;
        }
        
        .url-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .url-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .url-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .url-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #8f94fb;
            font-size: 14px;
        }
        
        .url-value {
            font-size: 12px;
            opacity: 0.8;
            word-break: break-all;
        }
        
        .url-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .url-modal-button {
            background: rgba(78, 84, 200, 0.8);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .url-modal-button:active {
            transform: scale(0.95);
        }
        
        .url-modal-button.cancel {
            background: rgba(255, 107, 107, 0.8);
        }
        
        /* Touch-specific styles */
        @media (hover: none) and (pointer: coarse) {
            .search-result:hover {
                transform: none;
            }
            
            .server-button:hover {
                transform: none;
            }
            
            .episode-button:hover {
                transform: none;
            }
            
            .control-button:hover {
                transform: none;
            }
            
            .control-button:active {
                transform: scale(0.9);
            }
        }
        
        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .logo h1 {
                font-size: 20px;
            }
            
            .search-input {
                padding: 10px 15px;
                font-size: 15px;
            }
            
            .search-button {
                padding: 10px 15px;
                font-size: 14px;
            }
            
            .search-results {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            
            .result-poster {
                height: 180px;
            }
            
            .server-selectors {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .server-selector {
                flex: 0 0 calc(50% - 5px);
            }
            
            .server-button {
                padding: 8px 10px;
                font-size: 13px;
            }
            
            .server-dropdown {
                width: 95%;
            }
            
            .episode-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
                gap: 6px;
            }
            
            .episode-button {
                padding: 6px 3px;
                font-size: 12px;
                min-height: 30px;
            }
            
            .player-header {
                padding: 10px;
            }
            
            .movie-title {
                font-size: 14px;
            }
            
            .current-server {
                font-size: 11px;
                padding: 5px 10px;
                max-width: 120px;
            }
            
            .player-controls {
                padding: 10px 20px;
                gap: 15px;
            }
            
            .control-button {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .server-selector {
                flex: 0 0 100%;
            }
            
            .search-results {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }
            
            .result-poster {
                height: 150px;
            }
            
            .episode-grid {
                grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            }
            
            .player-controls {
                padding: 8px 15px;
                gap: 10px;
            }
            
            .control-button {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .lock-screen-icon {
                font-size: 50px;
            }
            
            .lock-screen-message {
                font-size: 16px;
            }
            
            .unlock-button {
                padding: 12px 30px;
                font-size: 14px;
            }
        }
        
        /* Landscape mode */
        @media (orientation: landscape) and (max-height: 600px) {
            .container {
                padding: 5px;
            }
            
            header {
                flex-direction: row;
                padding: 10px 0;
            }
            
            .logo {
                flex-shrink: 0;
            }
            
            .search-container {
                margin-bottom: 10px;
            }
            
            .server-selectors {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 5px;
                justify-content: flex-start;
            }
            
            .server-selector {
                flex: 0 0 auto;
                min-width: 100px;
            }
            
            .player-container {
                margin-top: 10px;
            }
            
            .video-wrapper {
                padding-top: 56.25vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-film"></i>
                <h1>MovieStream</h1>
            </div>

            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search movies, TV shows, anime...">
                <button class="search-button" id="search-button">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </header>

        <div class="database-info" id="database-info">
            <i class="fas fa-database"></i>
            <span>Loading databases...</span>
        </div>

        <div class="search-results hidden" id="search-results"></div>

        <div class="episode-nav hidden" id="episode-nav">
            <div class="episode-nav-header">
                <div class="episode-nav-title">Episodes</div>
                <select class="season-selector" id="season-selector">
                    <option value="1">Season 1</option>
                </select>
            </div>
            <div class="episode-grid" id="episode-grid"></div>
        </div>

        <div class="server-selectors">
            <!-- Server dropdowns remain the same as before -->
            <!-- Hindi Server -->
            <div class="server-selector">
                <div class="server-button" id="hindi-server-button">
                    <i class="fas fa-cloud"></i>
                    <span>Hindi</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="server-dropdown" id="hindi-server-dropdown">
                    <div class="server-list">
                        <!-- Hindi servers list -->
                    </div>
                </div>
            </div>

            <!-- English Server -->
            <div class="server-selector">
                <div class="server-button" id="English-server-button">
                    <i class="fas fa-cloud"></i>
                    <span>English</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="server-dropdown" id="English-server-dropdown">
                    <div class="server-list">
                        <!-- English servers list -->
                    </div>
                </div>
            </div>

            <!-- Bengali Server -->
            <div class="server-selector">
                <div class="server-button" id="bengali-server-button">
                    <i class="fas fa-cloud"></i>
                    <span>Bengali</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="server-dropdown" id="bengali-server-dropdown">
                    <div class="server-list">
                        <!-- Bengali servers list -->
                    </div>
                </div>
            </div>

            <!-- German Server -->
            <div class="server-selector">
                <div class="server-button" id="german-server-button">
                    <i class="fas fa-cloud"></i>
                    <span>German</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="server-dropdown" id="german-server-dropdown">
                    <div class="server-list">
                        <!-- German servers list -->
                    </div>
                </div>
            </div>

            <!-- GermanMovie Server -->
            <div class="server-selector">
                <div class="server-button" id="germanmovie-server-button">
                    <i class="fas fa-cloud"></i>
                    <span>GermanMovie</span>
                    <i class="fas fa-chevron-down"></i>

                        <button class="control-button" id="play-pause-btn">

                        <button class="control-button lock-button" id="lock-btn">
                            <i class="fas fa-unlock"></i>

    <!-- URL Selection Modal -->
    <div class="url-modal" id="url-modal">
        <div class="url-modal-content">
            <div class="url-modal-header">
                <h2 class="url-modal-title" id="url-modal-title">Select URL</h2>
                <button class="url-modal-close" id="url-modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>

                <!-- URL items will be dynamically added here -->
            </div>

                <button class="url-modal-button cancel" id="url-modal-cancel">Cancel</button>
                <button class="url-modal-button" id="url-modal-play">Play Selected</button>

    <script>
        const TMDB_API_KEY = '6fad3f86b8452ee232deb7977d7dcf58';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const TMDB_IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const ANIME_DATABASE_URL = 'https://cdn.jsdelivr.net/gh/danka1567/animegerman@main/anime_series_datalast_update_nov_2025.json';
        const GERMAN_CDN_URL = 'https://cdn.jsdelivr.net/gh/danka1567/animegerman@main/anime_world_to_1.json';
        const DEMOVIES_URL = 'https://cdn.jsdelivr.net/gh/danka1567/animegerman@main/demoveis1.json';
        
        let currentContent = null;
        let currentSeason = 1;
        let currentEpisode = 1;
        let currentContentType = 'movie';
        let currentAnimeId = null;
        let allSeasons = [];
        let animeDatabase = [];
        let germanDatabase = [];
        let demoviesDatabase = [];
        let currentMatchedAnime = null;
        let currentGermanData = null;
        let currentDemoviesData = null;
        let currentImdbId = null;
        let currentServerType = null;
        let selectedUrl = null;
        let isPlayerLocked = false;
        let isFullscreen = false;
        let isPlaying = false;
        let touchTimer = null;
        
        // Mobile detection
        function isMobileDevice() {
            return (typeof window.orientation !== "undefined") || (navigator.userAgent.indexOf('IEMobile') !== -1);
        }
        
        // Touch detection
        function isTouchDevice() {
            return 'ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;
        }
        
        function loadAnimeDatabase() {
            const databaseInfo = document.getElementById('database-info');
            
            fetch(ANIME_DATABASE_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    animeDatabase = data;
                    console.log("Anime database loaded with", animeDatabase.length, "entries");
                })
                .catch(error => {
                    console.error('Error loading anime database:', error);
                    animeDatabase = [];
                });
        }
        
        function loadGermanDatabase() {
            fetch(GERMAN_CDN_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    germanDatabase = data;
                    console.log("German database loaded with", germanDatabase.length, "entries");
                })
                .catch(error => {
                    console.error('Error loading German database:', error);
                    germanDatabase = [];
                });
        }
        
        function loadDemoviesDatabase() {
            const databaseInfo = document.getElementById('database-info');
            
            fetch(DEMOVIES_URL)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    demoviesDatabase = data;
                    databaseInfo.innerHTML = `<i class="fas fa-database"></i> All databases loaded successfully`;
                    console.log("Demovies database loaded with", demoviesDatabase.length, "entries");
                })
                .catch(error => {
                    console.error('Error loading Demovies database:', error);
                    databaseInfo.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error loading database: ${error.message}`;
                    demoviesDatabase = [];
                });
        }
        
        function getOffsetIdForCurrentContent() {
            if (!currentContent) return null;
            
            const matchedAnime = animeDatabase.find(anime => anime.tmdb_id === currentContent.id);
            
            if (matchedAnime) {
                console.log("Found matching anime in database:", matchedAnime);
                
                if (currentContentType === 'tv' || currentContentType === 'anime') {
                    return matchedAnime.episode_offset + currentEpisode;
                } else {
                    return matchedAnime.episode_offset;
                }
            }
            
            console.log("No matching anime found in database for TMDB ID:", currentContent.id);
            return null;
        }
        
        function getGermanDataForCurrentContent() {
            if (!currentContent) return null;
            
            const matchedGermanData = germanDatabase.find(item => 
                item.tmdb_id === currentContent.id.toString() && 
                parseInt(item.Episode_number) === currentEpisode
            );
            
            if (matchedGermanData) {
                console.log("Found matching German data:", matchedGermanData);
                return matchedGermanData;
            }
            
            console.log("No matching German data found for TMDB ID:", currentContent.id, "Episode:", currentEpisode);
            return null;
        }
        
        function getDemoviesDataForCurrentContent() {
            if (!currentContent) return null;
            
            // Try to match by TMDB ID first
            let matchedDemoviesData = demoviesDatabase.find(item => 
                item.tmdb_id && item.tmdb_id.toString() === currentContent.id.toString()
            );
            
            // If no match by TMDB ID, try to match by IMDb ID
            if (!matchedDemoviesData && currentImdbId) {
                matchedDemoviesData = demoviesDatabase.find(item => 
                    item.imdb_id && item.imdb_id === currentImdbId
                );
            }
            
            // If still no match, try to match by title (fuzzy matching)
            if (!matchedDemoviesData && currentContent.title) {
                const title = currentContent.title.toLowerCase();
                matchedDemoviesData = demoviesDatabase.find(item => 
                    item.movie_name && item.movie_name.toLowerCase().includes(title)
                );
            }
            
            if (matchedDemoviesData) {
                console.log("Found matching Demovies data:", matchedDemoviesData);
                return matchedDemoviesData;
            }
            
            console.log("No matching Demovies data found for TMDB ID:", currentContent.id);
            return null;
        }
        
        function updateServerUrlsWithGermanData() {
            const germanData = getGermanDataForCurrentContent();
            currentGermanData = germanData;
            
            if (germanData) {
                updateServerUrl('VOE-ENGLISH', germanData.Voe_Eng_Link);
                updateServerUrl('Filemoon-ENGLISH', germanData.Filemoon_Eng_Link);
                updateServerUrl('Vidmoly-ENGLISH', germanData.Vidmoly_Eng_Link);
                updateServerUrl('VOE German Dub', germanData.Voe_German_Dub_Link);
                updateServerUrl('VIDMOLY-German Dub', germanData.Vidmoly_German_Dub_Link);
                updateServerUrl('FILEMOON-GERMAN Dub', germanData.Filemoon_German_Dub_Link);
                updateServerUrl('VOE German Sub', germanData.Voe_Original_Lang_German_Sub_Link);
                updateServerUrl('VIDMOLY-German Sub', germanData.Vidmoly_Original_Lang_German_Sub_Link);
                updateServerUrl('FILEMOON-GERMAN Sub', germanData.Filemoon_Original_Lang_German_Sub_Link);
                
                const databaseInfo = document.getElementById('database-info');
                databaseInfo.innerHTML = `<i class="fas fa-database"></i> German CDN connected - Episode ${germanData.Episode_number}: ${germanData.German_title}`;
            } else {
                resetServerUrls();
            }
        }
        
        function updateServerUrl(serverName, url) {
            const serverItem = document.querySelector(`[data-server="${serverName}"]`);
            if (serverItem && url) {
                serverItem.setAttribute('data-url', url);
            }
        }
        
        function resetServerUrls() {
            updateServerUrl('VOE-ENGLISH', '{{Voe_Eng_Link}}');
            updateServerUrl('Filemoon-ENGLISH', '{{Filemoon_Eng_Link}}');
            updateServerUrl('Vidmoly-ENGLISH', '{{Vidmoly_Eng_Link}}');
            updateServerUrl('VOE German Dub', '{{Voe_German_Dub_Link}}');
            updateServerUrl('VIDMOLY-German Dub', '{{Vidmoly_German_Dub_Link}}');
            updateServerUrl('FILEMOON-GERMAN Dub', '{{Filemoon_German_Dub_Link}}');
            updateServerUrl('VOE German Sub', '{{Voe_Original_Lang_German_Sub_Link}}');
            updateServerUrl('VIDMOLY-German Sub', '{{Vidmoly_Original_Lang_German_Sub_Link}}');
            updateServerUrl('FILEMOON-GERMAN Sub', '{{Filemoon_Original_Lang_German_Sub_Link}}');
        }
        
        function fetchImdbId(contentId, contentType) {
            return fetch(`${TMDB_BASE_URL}/${contentType}/${contentId}?api_key=${TMDB_API_KEY}`)
                .then(response => response.json())
                .then(data => {
                    if (data.imdb_id) {
                        return data.imdb_id;
                    } else {
                        // For TV shows, we need to get the external_ids to get the IMDb ID
                        if (contentType === 'tv') {
                            return fetch(`${TMDB_BASE_URL}/tv/${contentId}/external_ids?api_key=${TMDB_API_KEY}`)
                                .then(response => response.json())
                                .then(externalData => {
                                    if (externalData.imdb_id) {
                                        return externalData.imdb_id;
                                    } else {
                                        return 'tt' + (10000000 + contentId);
                                    }
                                })
                                .catch(error => {
                                    console.error('Error fetching TV external IDs:', error);
                                    return 'tt' + (10000000 + contentId);
                                });
                        } else {
                            return 'tt' + (10000000 + contentId);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching IMDb ID:', error);
                    return 'tt' + (10000000 + contentId);
                });
        }
        
        function showUrlModal(serverType) {
            const modal = document.getElementById('url-modal');
            const modalTitle = document.getElementById('url-modal-title');
            const urlList = document.getElementById('url-list');
            
            currentServerType = serverType;
            selectedUrl = null;
            
            // Clear previous URL list
            urlList.innerHTML = '';
            
            // Set modal title
            modalTitle.textContent = `Select ${serverType.toUpperCase()} URL`;
            
            // Get URLs for the selected server type
            const urls = getUrlsForServerType(serverType);
            
            if (urls.length === 0) {
                urlList.innerHTML = '<div class="error-message">No URLs available for this server</div>';
            } else {
                // Add URL items to the list
                urls.forEach((url, index) => {
                    if (url && url.trim() !== '') {
                        const urlItem = document.createElement('div');
                        urlItem.className = 'url-item';
                        urlItem.setAttribute('data-url', url);
                        
                        urlItem.innerHTML = `
                            <div class="url-name">${serverType}_${index + 1}</div>
                            <div class="url-value">${url}</div>
                        `;
                        
                        urlItem.addEventListener('click', function() {
                            // Remove active class from all items
                            document.querySelectorAll('.url-item').forEach(item => {
                                item.classList.remove('active');
                            });
                            
                            // Add active class to clicked item
                            this.classList.add('active');
                            
                            // Store selected URL
                            selectedUrl = url;
                        });
                        
                        urlList.appendChild(urlItem);
                    }
                });
                
                // Select first URL by default
                if (urlList.firstChild) {
                    urlList.firstChild.classList.add('active');
                    selectedUrl = urls[0];
                }
            }
            
            // Show modal
            modal.classList.add('active');
        }
        
        function getUrlsForServerType(serverType) {
            if (!currentDemoviesData) return [];
            
            const urls = [];
            
            switch(serverType) {
                case 'vino':
                    for (let i = 1; i <= 12; i++) {
                        const url = currentDemoviesData[`vino_${i}`];
                        if (url && url.trim() !== '') {
                            urls.push(url);
                        }
                    }
                    break;
                    
                case 'dood':
                    for (let i = 1; i <= 10; i++) {
                        const url = currentDemoviesData[`dood_${i}`];
                        if (url && url.trim() !== '') {
                            urls.push(url);
                        }
                    }
                    break;
                    
                case 'fis':
                    for (let i = 1; i <= 10; i++) {
                        const url = currentDemoviesData[`fis_${i}`];
                        if (url && url.trim() !== '') {
                            urls.push(url);
                        }
                    }
                    break;
            }
            
            return urls;
        }
        
        function hideUrlModal() {
            const modal = document.getElementById('url-modal');
            modal.classList.remove('active');
        }
        
        function playSelectedUrl() {
            if (selectedUrl) {
                const videoPlayer = document.getElementById('video-player');
                const currentServerName = document.getElementById('current-server-name');
                
                videoPlayer.src = selectedUrl;
                currentServerName.textContent = `${currentServerType.toUpperCase()} - ${selectedUrl.substring(0, 20)}...`;
                
                // Auto-play video on mobile
                if (isMobileDevice()) {
                    videoPlayer.setAttribute('allow', 'autoplay');
                    setTimeout(() => {
                        videoPlayer.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                    }, 1000);
                }
                
                hideUrlModal();
            }
        }
        
        function generateMegakinoUrl() {
            if (!currentContent || !currentImdbId) return '';
            
            const baseUrl = 'https://megakino.stream/p/';
            
            if (currentContentType === 'movie') {
                return `${baseUrl}movies/${currentImdbId}`;
            } else {
                return `${baseUrl}series/${currentImdbId}`;
            }
        }
        
        function toggleLockScreen() {
            const lockScreen = document.getElementById('lock-screen-overlay');
            const lockBtn = document.getElementById('lock-btn');
            const playerControls = document.getElementById('player-controls-overlay');
            
            isPlayerLocked = !isPlayerLocked;
            
            if (isPlayerLocked) {
                lockScreen.classList.add('active');
                lockBtn.innerHTML = '<i class="fas fa-lock"></i>';
                lockBtn.classList.add('locked');
                playerControls.style.opacity = '0';
                playerControls.style.pointerEvents = 'none';
            } else {
                lockScreen.classList.remove('active');
                lockBtn.innerHTML = '<i class="fas fa-unlock"></i>';
                lockBtn.classList.remove('locked');
                playerControls.style.opacity = '1';
                playerControls.style.pointerEvents = 'auto';
            }
        }
        
        function toggleFullscreen() {
            const playerContainer = document.getElementById('player-container');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            
            if (!isFullscreen) {
                playerContainer.classList.add('player-fullscreen');
                document.body.style.overflow = 'hidden';
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                isFullscreen = true;
                
                // Lock orientation on mobile devices
                if (isMobileDevice() && screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {
                        console.log('Orientation lock not supported');
                    });
                }
            } else {
                playerContainer.classList.remove('player-fullscreen');
                document.body.style.overflow = '';
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                isFullscreen = false;
                
                // Unlock orientation
                if (isMobileDevice() && screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }
        
        function togglePlayPause() {
            const videoPlayer = document.getElementById('video-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            
            if (videoPlayer.src) {
                try {
                    if (isPlaying) {
                        videoPlayer.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    } else {
                        videoPlayer.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    }
                    isPlaying = !isPlaying;
                } catch (error) {
                    console.log('Cannot control embedded video:', error);
                }
            }
        }
        
        function showControlsTemporarily() {
            const playerControls = document.getElementById('player-controls-overlay');
            
            if (!isPlayerLocked) {
                playerControls.style.opacity = '1';
                playerControls.style.pointerEvents = 'auto';
                
                clearTimeout(touchTimer);
                touchTimer = setTimeout(() => {
                    playerControls.style.opacity = '0';
                    playerControls.style.pointerEvents = 'none';
                }, 3000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadAnimeDatabase();
            loadGermanDatabase();
            loadDemoviesDatabase();
            
            // Add touch detection class
            if (isTouchDevice()) {
                document.querySelector('.video-wrapper').classList.add('touch');
            }
            
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const searchResults = document.getElementById('search-results');
            const episodeNav = document.getElementById('episode-nav');
            const seasonSelector = document.getElementById('season-selector');
            const episodeGrid = document.getElementById('episode-grid');
            const serverButtons = document.querySelectorAll('.server-button');
            const serverDropdowns = document.querySelectorAll('.server-dropdown');
            const serverItems = document.querySelectorAll('.server-item');
            const megaplayServer = document.querySelector('.megaplay-server');
            const videoPlayer = document.getElementById('video-player');
            const currentServerName = document.getElementById('current-server-name');
            const movieTitle = document.getElementById('movie-title');
            const databaseInfo = document.getElementById('database-info');
            
            // Player control elements
            const playPauseBtn = document.getElementById('play-pause-btn');
            const lockBtn = document.getElementById('lock-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const unlockBtn = document.getElementById('unlock-btn');
            const playerControlsOverlay = document.getElementById('player-controls-overlay');
            
            // URL Modal elements
            const urlModal = document.getElementById('url-modal');
            const urlModalClose = document.getElementById('url-modal-close');
            const urlModalCancel = document.getElementById('url-modal-cancel');
            const urlModalPlay = document.getElementById('url-modal-play');
            
            // Initialize player controls
            playPauseBtn.addEventListener('click', togglePlayPause);
            lockBtn.addEventListener('click', toggleLockScreen);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            unlockBtn.addEventListener('click', toggleLockScreen);
            
            // Touch controls for video player
            videoPlayer.addEventListener('click', function(e) {
                e.stopPropagation();
                showControlsTemporarily();
            });
            
            playerControlsOverlay.addEventListener('touchstart', function(e) {
                e.stopPropagation();
                showControlsTemporarily();
            });
            
            // Hide controls when touching outside
            document.addEventListener('touchstart', function(e) {
                if (!playerControlsOverlay.contains(e.target)) {
                    playerControlsOverlay.style.opacity = '0';
                    playerControlsOverlay.style.pointerEvents = 'none';
                }
            });
            
            // Handle escape key for fullscreen and lock
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (isFullscreen) {
                        toggleFullscreen();
                    }
                    if (isPlayerLocked) {
                        toggleLockScreen();
                    }
                }
            });
            
            searchButton.addEventListener('click', performSearch);
            
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            seasonSelector.addEventListener('change', function() {
                currentSeason = parseInt(this.value);
                loadEpisodesForCurrentSeason();
            });
            
            serverButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const dropdownId = this.id.replace('-button', '-dropdown');
                    const dropdown = document.getElementById(dropdownId);
                    
                    serverDropdowns.forEach(d => {
                        if (d.id !== dropdownId) {
                            d.classList.remove('active');
                        }
                    });
                    
                    dropdown.classList.toggle('active');
                });
            });
            
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.server-dropdown') && !e.target.closest('.server-button')) {
                    serverDropdowns.forEach(dropdown => {
                        dropdown.classList.remove('active');
                    });
                }
            });
            
            serverDropdowns.forEach(dropdown => {
                dropdown.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            });
            
            serverItems.forEach(item => {
                item.addEventListener('click', function() {
                    if (!currentContent) {
                        alert('Please select content first.');
                        return;
                    }
                    
                    const serverType = this.getAttribute('data-server');
                    const serverName = this.querySelector('.server-name').textContent;
                    const serverUrlTemplate = this.getAttribute('data-url');
                    const sandboxAttr = this.getAttribute('data-sandbox');
                    
                    serverItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Check if this is a special server (vino, dood, fis)
                    if (serverType === 'vino' || serverType === 'dood' || serverType === 'fis') {
                        if (currentDemoviesData) {
                            showUrlModal(serverType);
                        } else {
                            alert('No stream URLs available.');
                        }
                    } 
                    // Special handling for Megakino server
                    else if (serverType === 'megakino') {
                        if (!currentImdbId) {
                            alert('IMDb ID not available.');
                            return;
                        }
                        
                        const actualUrl = generateMegakinoUrl();
                        
                        if (sandboxAttr) {
                            videoPlayer.setAttribute('sandbox', sandboxAttr);
                        } else {
                            videoPlayer.removeAttribute('sandbox');
                        }
                        
                        videoPlayer.src = actualUrl;
                        currentServerName.textContent = serverName;
                    }
                    else {
                        const actualUrl = generateServerUrl(serverUrlTemplate);
                        
                        if (sandboxAttr) {
                            videoPlayer.setAttribute('sandbox', sandboxAttr);
                        } else {
                            videoPlayer.removeAttribute('sandbox');
                        }
                        
                        videoPlayer.src = actualUrl;
                        currentServerName.textContent = serverName;
                        
                        if (serverType === 'megaplay' && currentMatchedAnime) {
                            databaseInfo.innerHTML = `<i class="fas fa-database"></i> Connected to serial no: ${currentMatchedAnime.serial_no} - ${currentMatchedAnime.title}`;
                        }
                    }
                    
                    serverDropdowns.forEach(dropdown => {
                        dropdown.classList.remove('active');
                    });
                    
                    // Show controls temporarily
                    showControlsTemporarily();
                });
            });
            
            // URL Modal event listeners
            urlModalClose.addEventListener('click', hideUrlModal);
            urlModalCancel.addEventListener('click', hideUrlModal);
            urlModalPlay.addEventListener('click', playSelectedUrl);
            
            // Close modal when clicking outside
            urlModal.addEventListener('click', function(e) {
                if (e.target === urlModal) {
                    hideUrlModal();
                }
            });
            
            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;
                
                searchResults.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
                searchResults.classList.remove('hidden');
                
                // Hide keyboard on mobile
                if (isMobileDevice()) {
                    searchInput.blur();
                }
                
                fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(data => {
                        displaySearchResults(data.results);
                    })
                    .catch(error => {
                        console.error('Error searching TMDB:', error);
                        searchResults.innerHTML = '<div class="error-message">Error searching. Please try again.</div>';
                    });
            }
            
            function displaySearchResults(results) {
                searchResults.innerHTML = '';
                
                if (results.length === 0) {
                    searchResults.innerHTML = '<div style="text-align: center; padding: 20px; width: 100%;">No results found.</div>';
                    return;
                }
                
                results.forEach(result => {
                    const resultElement = document.createElement('div');
                    resultElement.className = 'search-result';
                    
                    const mediaType = result.media_type;
                    const title = result.title || result.name;
                    const year = result.release_date ? new Date(result.release_date).getFullYear() : 
                                result.first_air_date ? new Date(result.first_air_date).getFullYear() : 'N/A';
                    
                    const isAnime = title.toLowerCase().includes('anime') || 
                                    (mediaType === 'tv' && result.genre_ids && result.genre_ids.includes(16));
                    
                    const posterUrl = result.poster_path ? 
                        `${TMDB_IMAGE_BASE_URL}${result.poster_path}` : 
                        'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjMwMCIgdmlld0JveD0iMCAwIDIwMCAzMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMzAwIiBmaWxsPSIjMWExYTJlIi8+CjxwYXRoIGQ9Ik04MCAxMjBIMTIwVjE4MEg4MFYxMjBaIiBmaWxsPSIjNGU1NGM4Ii8+CjxwYXRoIGQ9Ik02MCA2MEgxNDBWODBINjBWNjBaIiBmaWxsPSIjNGU1NGM4Ii8+CjxwYXRoIGQ9Ik00MCAyMjBIMTYwVjI0MEg0MFYyMjBaIiBmaWxsPSIjNGU1NGM4Ii8+Cjwvc3ZnPgo=';
                    
                    resultElement.innerHTML = `
                        <img src="${posterUrl}" alt="${title}" class="result-poster">
                        <div class="result-info">
                            <div class="result-title">${title}</div>
                            <div class="result-year">${year} • ${mediaType === 'movie' ? 'Movie' : 'TV Show'}</div>
                            ${isAnime ? '<div class="result-type">Anime</div>' : ''}
                        </div>
                    `;
                    
                    resultElement.addEventListener('click', () => {
                        selectContent(result, isAnime);
                    });
                    
                    searchResults.appendChild(resultElement);
                });
            }
            
            function selectContent(content, isAnime = false) {
                currentContent = content;
                currentContentType = content.media_type;
                currentMatchedAnime = null;
                currentGermanData = null;
                currentDemoviesData = null;
                currentImdbId = null;
                
                if (isAnime) {
                    currentAnimeId = content.id;
                } else {
                    currentAnimeId = null;
                }
                
                const title = content.title || content.name;
                const year = content.release_date ? new Date(content.release_date).getFullYear() : 
                            content.first_air_date ? new Date(content.first_air_date).getFullYear() : '';
                movieTitle.textContent = `${title} (${year})`;
                
                searchResults.classList.add('hidden');
                
                const contentType = content.media_type === 'movie' ? 'movie' : 'tv';
                fetchImdbId(content.id, contentType)
                    .then(imdbId => {
                        currentImdbId = imdbId;
                        
                        const matchedAnime = animeDatabase.find(anime => anime.tmdb_id === content.id);
                        if (matchedAnime) {
                            currentMatchedAnime = matchedAnime;
                        }
                        
                        currentGermanData = getGermanDataForCurrentContent();
                        currentDemoviesData = getDemoviesDataForCurrentContent();
                        
                        let dbInfo = '';
                        if (currentMatchedAnime) {
                            dbInfo += `Anime DB: ${currentMatchedAnime.title} | `;
                        }
                        if (currentGermanData) {
                            dbInfo += `German CDN: Episode ${currentGermanData.Episode_number} | `;
                        }
                        if (currentDemoviesData) {
                            dbInfo += `Demovies: ${currentDemoviesData.movie_name}`;
                        }
                        
                        if (dbInfo) {
                            databaseInfo.innerHTML = `<i class="fas fa-database"></i> ${dbInfo}`;
                        } else {
                            databaseInfo.innerHTML = `<i class="fas fa-database"></i> No matching data found`;
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching IMDb ID:', error);
                        currentImdbId = null;
                        
                        const matchedAnime = animeDatabase.find(anime => anime.tmdb_id === content.id);
                        if (matchedAnime) {
                            currentMatchedAnime = matchedAnime;
                        }
                        
                        currentGermanData = getGermanDataForCurrentContent();
                        currentDemoviesData = getDemoviesDataForCurrentContent();
                        
                        let dbInfo = '';
                        if (currentMatchedAnime) {
                            dbInfo += `Anime DB: ${currentMatchedAnime.title} | `;
                        }
                        if (currentGermanData) {
                            dbInfo += `German CDN: Episode ${currentGermanData.Episode_number} | `;
                        }
                        if (currentDemoviesData) {
                            dbInfo += `Demovies: ${currentDemoviesData.movie_name}`;
                        }
                        
                        if (dbInfo) {
                            databaseInfo.innerHTML = `<i class="fas fa-database"></i> ${dbInfo}`;
                        } else {
                            databaseInfo.innerHTML = `<i class="fas fa-database"></i> No matching data found`;
                        }
                    });
                
                updateServerUrlsWithGermanData();
                
                if (isAnime || (content.genre_ids && content.genre_ids.includes(16))) {
                    megaplayServer.classList.remove('hidden');
                } else {
                    megaplayServer.classList.add('hidden');
                }
                
                if (content.media_type === 'tv') {
                    episodeNav.classList.remove('hidden');
                    fetchAllSeasons(content.id);
                } else if (isAnime) {
                    episodeNav.classList.remove('hidden');
                    fetchAllSeasons(content.id);
                } else {
                    episodeNav.classList.add('hidden');
                }
                
                serverItems.forEach(item => item.classList.remove('active'));
                currentServerName.textContent = 'No server selected';
                
                videoPlayer.src = '';
                
                // Reset play/pause button
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
                
                // Hide controls
                playerControlsOverlay.style.opacity = '0';
                playerControlsOverlay.style.pointerEvents = 'none';
            }
            
            function fetchAllSeasons(contentId) {
                episodeNav.classList.remove('hidden');
                episodeGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
                
                fetch(`${TMDB_BASE_URL}/tv/${contentId}?api_key=${TMDB_API_KEY}`)
                    .then(response => response.json())
                    .then(tvDetails => {
                        allSeasons = tvDetails.seasons.filter(season => season.season_number > 0);
                        
                        if (allSeasons.length === 0) {
                            episodeGrid.innerHTML = '<div class="error-message">No seasons available.</div>';
                            return;
                        }
                        
                        seasonSelector.innerHTML = '';
                        allSeasons.forEach(season => {
                            const option = document.createElement('option');
                            option.value = season.season_number;
                            option.textContent = `S${season.season_number} (${season.episode_count} ep)`;
                            seasonSelector.appendChild(option);
                        });
                        
                        currentSeason = allSeasons[0].season_number;
                        loadEpisodesForCurrentSeason();
                    })
                    .catch(error => {
                        console.error('Error fetching TV details:', error);
                        episodeGrid.innerHTML = '<div class="error-message">Error loading.</div>';
                    });
            }
            
            function loadEpisodesForCurrentSeason() {
                episodeGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
                
                fetch(`${TMDB_BASE_URL}/tv/${currentContent.id}/season/${currentSeason}?api_key=${TMDB_API_KEY}`)
                    .then(response => response.json())
                    .then(seasonDetails => {
                        episodeGrid.innerHTML = '';
                        
                        if (!seasonDetails.episodes || seasonDetails.episodes.length === 0) {
                            episodeGrid.innerHTML = '<div class="error-message">No episodes.</div>';
                            return;
                        }
                        
                        seasonDetails.episodes.forEach(episode => {
                            const episodeButton = document.createElement('button');
                            episodeButton.className = 'episode-button';
                            episodeButton.textContent = episode.episode_number;
                            episodeButton.title = `${episode.name || `Episode ${episode.episode_number}`}`;
                            
                            episodeButton.addEventListener('click', function() {
                                document.querySelectorAll('.episode-button').forEach(btn => {
                                    btn.classList.remove('active');
                                });
                                this.classList.add('active');
                                
                                currentEpisode = episode.episode_number;
                                
                                updateServerUrlsWithGermanData();
                                updateServerUrlsWithEpisode();
                                
                                // Show controls temporarily
                                showControlsTemporarily();
                            });
                            
                            episodeGrid.appendChild(episodeButton);
                        });
                        
                        if (seasonDetails.episodes.length > 0) {
                            episodeGrid.children[0].classList.add('active');
                            currentEpisode = seasonDetails.episodes[0].episode_number;
                            
                            updateServerUrlsWithGermanData();
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching season details:', error);
                        episodeGrid.innerHTML = '<div class="error-message">Error loading.</div>';
                    });
            }
            
            function updateServerUrlsWithEpisode() {
                const activeServer = document.querySelector('.server-item.active');
                if (activeServer && currentContent && (currentContentType === 'tv' || currentContentType === 'anime')) {
                    const serverUrlTemplate = activeServer.getAttribute('data-url');
                    const serverType = activeServer.getAttribute('data-server');
                    
                    if (serverType !== 'vino' && serverType !== 'dood' && serverType !== 'fis' && serverType !== 'megakino') {
                        const actualUrl = generateServerUrl(serverUrlTemplate);
                        const sandboxAttr = activeServer.getAttribute('data-sandbox');
                        
                        if (sandboxAttr) {
                            videoPlayer.setAttribute('sandbox', sandboxAttr);
                        } else {
                            videoPlayer.removeAttribute('sandbox');
                        }
                        
                        videoPlayer.src = actualUrl;
                        
                        // Auto-play on mobile
                        if (isMobileDevice()) {
                            videoPlayer.setAttribute('allow', 'autoplay');
                            setTimeout(() => {
                                videoPlayer.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                            }, 1000);
                        }
                    }
                }
            }
            
            function generateServerUrl(template) {
                if (!currentContent) return '';
                
                let url = template;
                
                if (url.includes('{{content_type}}')) {
                    if (currentContentType === 'anime') {
                        url = url.replace('{{content_type}}', 'anime');
                    } else {
                        url = url.replace('{{content_type}}', currentContentType);
                    }
                }
                
                if (url.includes('{{tmdb_id}}')) {
                    url = url.replace('{{tmdb_id}}', currentContent.id);
                }
                
                if (url.includes('{{imdb_id}}')) {
                    url = url.replace('{{imdb_id}}', currentImdbId || '');
                }
                
                if (url.includes('{{anilist_id}}')) {
                    url = url.replace('{{anilist_id}}', currentAnimeId || currentContent.id);
                }
                
                if ((currentContentType === 'tv' || currentContentType === 'anime') && url.includes('{{tv_episode}}')) {
                    url = url.replace('{{tv_episode}}', `/${currentSeason}/${currentEpisode}`);
                } else {
                    url = url.replace('{{tv_episode}}', '');
                }
                
                if (url.includes('{{offset_id}}')) {
                    const offsetId = getOffsetIdForCurrentContent();
                    if (offsetId) {
                        url = url.replace('{{offset_id}}', offsetId);
                    } else {
                        url = url.replace('{{offset_id}}', currentContent.id);
                    }
                }
                
                if (currentGermanData) {
                    if (url.includes('{{Voe_Eng_Link}}')) {
                        url = url.replace('{{Voe_Eng_Link}}', currentGermanData.Voe_Eng_Link || '');
                    }
                    if (url.includes('{{Filemoon_Eng_Link}}')) {
                        url = url.replace('{{Filemoon_Eng_Link}}', currentGermanData.Filemoon_Eng_Link || '');
                    }
                    if (url.includes('{{Vidmoly_Eng_Link}}')) {
                        url = url.replace('{{Vidmoly_Eng_Link}}', currentGermanData.Vidmoly_Eng_Link || '');
                    }
                    if (url.includes('{{Voe_German_Dub_Link}}')) {
                        url = url.replace('{{Voe_German_Dub_Link}}', currentGermanData.Voe_German_Dub_Link || '');
                    }
                    if (url.includes('{{Vidmoly_German_Dub_Link}}')) {
                        url = url.replace('{{Vidmoly_German_Dub_Link}}', currentGermanData.Vidmoly_German_Dub_Link || '');
                    }
                    if (url.includes('{{Filemoon_German_Dub_Link}}')) {
                        url = url.replace('{{Filemoon_German_Dub_Link}}', currentGermanData.Filemoon_German_Dub_Link || '');
                    }
                    if (url.includes('{{Voe_Original_Lang_German_Sub_Link}}')) {
                        url = url.replace('{{Voe_Original_Lang_German_Sub_Link}}', currentGermanData.Voe_Original_Lang_German_Sub_Link || '');
                    }
                    if (url.includes('{{Vidmoly_Original_Lang_German_Sub_Link}}')) {
                        url = url.replace('{{Vidmoly_Original_Lang_German_Sub_Link}}', currentGermanData.Vidmoly_Original_Lang_German_Sub_Link || '');
                    }
                    if (url.includes('{{Filemoon_Original_Lang_German_Sub_Link}}')) {
                        url = url.replace('{{Filemoon_Original_Lang_German_Sub_Link}}', currentGermanData.Filemoon_Original_Lang_German_Sub_Link || '');
                    }
                }
                
                return url;
            }
        });
    </script>
</body>
</html>
