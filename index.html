<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AniStream – Auto Intro Skipping · Instant Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box }
:root {
  --bg0:#05050f; --bg1:#09091a; --bg2:#0f0f24; --bg3:#151530;
  --acc:#634dff; --acc2:#ff4d7a; --acc3:#00dfff;
  --text:#eeeef6; --muted:rgba(238,238,246,.44); --border:rgba(255,255,255,.055);
  --glow:rgba(99,77,255,.2); --skip:#f59e0b; --green:#22c55e;
  --r:10px; --tr:.2s cubic-bezier(.2,0,0,1);
}
body{ background:var(--bg0); color:var(--text); font-family:'DM Sans',sans-serif; overflow-x:hidden; line-height:1.5 }
::-webkit-scrollbar{ width:4px; background:transparent }
::-webkit-scrollbar-thumb{ background:var(--acc); border-radius:99px }
header{position:sticky;top:0;z-index:200;background:rgba(5,5,15,.92);backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.hdr{max-width:1420px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-txt{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;background:linear-gradient(90deg,#fff 30%,var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:4px;list-style:none}
@media(max-width:680px){.nav{display:none}}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border-radius:30px;cursor:pointer}
.nav a:hover,.nav a.on{background:rgba(255,255,255,.06);color:var(--text)}
.hdr-search{flex:1;max-width:440px;margin-left:auto;position:relative}
.srch-wrap{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:0 4px 0 16px}
.srch-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;padding:9px 8px 9px 0}
.srch-btn{background:var(--acc);border:none;border-radius:99px;padding:6px 20px;color:#fff;font-weight:700;cursor:pointer}
.view{display:none}
.view.on{display:block}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
/* hero */
.hero{height:clamp(300px,52vw,580px);position:relative;overflow:hidden}
.hslide{position:absolute;inset:0;opacity:0;transition:opacity .85s ease}
.hslide.on{opacity:1}
.hslide-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(.35);transform:scale(1.04)}
.hslide-grad{position:absolute;inset:0;background:linear-gradient(to right,var(--bg0) 0%,rgba(5,5,15,.7) 40%,transparent 70%)}
.hcont{position:absolute;bottom:40px;left:40px;max-width:540px}
.htitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,6vw,72px);line-height:.92}
.hdesc{color:var(--muted);font-size:14px;margin:12px 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--acc),#9070ff);color:#fff;border:none;cursor:pointer}
.hdots{position:absolute;bottom:18px;right:30px;display:flex;gap:8px}
.hdot{width:24px;height:4px;background:rgba(255,255,255,.3);border-radius:99px;cursor:pointer}
.hdot.on{background:var(--acc);width:44px}
/* grids */
.sec{padding:36px 0 0}
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sec-ttl{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.acard{background:var(--bg2);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform var(--tr)}
.acard:hover{transform:translateY(-6px);border-color:var(--acc)}
.acard-img{width:100%;aspect-ratio:2/3;object-fit:cover}
.acard-ov{padding:12px}
.acard-ttl{font-weight:700;font-size:13px}
.gpills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.gpill{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:99px;padding:6px 18px;font-size:13px;font-weight:600;cursor:pointer}
.gpill.on,.gpill:hover{background:rgba(99,77,255,.2);border-color:var(--acc);color:var(--acc)}
.srow{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.scard{flex:0 0 135px;border-radius:12px;background:var(--bg2);cursor:pointer;border:1px solid var(--border)}
.scard img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px}
/* watch layout */
.wlayout{display:grid;grid-template-columns:1fr 300px;gap:24px;margin:20px 0}
@media(max-width:860px){.wlayout{grid-template-columns:1fr}}
.pbox{background:#000;border-radius:24px;overflow:hidden;border:1px solid var(--border)}
.ptoolbar{background:var(--bg2);padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap}
.ptitle{font-weight:800}
.vid-ratio{position:relative;padding-bottom:56.25%}
.vid-ratio iframe{position:absolute;width:100%;height:100%;border:none;background:#000}
/* ⭐ INTRO SKIP BUTTON (floating over video) */
.intro-skip-btn{
  position:absolute; bottom:80px; right:16px; z-index:150;
  display:none; align-items:center; gap:9px;
  background:linear-gradient(135deg,var(--skip),#ea580c);
  border:none; border-radius:60px; padding:12px 22px;
  font-weight:800; color:#fff; font-size:14px; cursor:pointer;
  box-shadow:0 6px 20px rgba(245,158,11,.5);
  animation: skipPulse 1.8s infinite;
  font-family:'DM Sans',sans-serif;
}
.intro-skip-btn.on{display:flex}
.intro-skip-btn:hover{transform:scale(1.05); animation:none}
@keyframes skipPulse{0%,100%{box-shadow:0 6px 18px rgba(245,158,11,.5)}50%{box-shadow:0 0 0 6px rgba(245,158,11,.3)}}
.player-ctrl-bar{background:var(--bg2);border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:12px}
.ctoggle{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:40px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer}
.ctoggle.on{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green)}
.srvbar{background:var(--bg2);border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px}
.srvtab{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.srvtab.on{background:rgba(99,77,255,.2);border-color:var(--acc);color:var(--acc)}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;padding:14px;max-height:280px;overflow-y:auto}
.epbtn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-weight:700;text-align:center;cursor:pointer}
.epbtn.on{background:var(--acc);color:#fff}
.ainfo-card{background:var(--bg1);border-radius:18px;border:1px solid var(--border);margin-bottom:18px}
.ainfo-poster{width:100%;aspect-ratio:16/9;object-fit:cover}
.ainfo-body{padding:14px}
.asynopsis{font-size:12px;color:var(--muted);margin-top:8px}
.autonext-overlay{
  position:absolute; bottom:90px; left:16px; z-index:140;
  background:rgba(5,5,15,.96); backdrop-filter:blur(14px);
  border:1px solid var(--acc); border-radius:18px; padding:14px 20px;
  display:none; flex-direction:column; gap:8px; min-width:200px;
}
.autonext-overlay.on{display:flex}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg2);border-left:3px solid var(--acc);padding:10px 16px;border-radius:12px;font-size:13px;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.loading-st{text-align:center;padding:40px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid rgba(99,77,255,.2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.back-btn{background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:7px 20px;margin:12px 0;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo" onclick="goHome()"><div class="logo-icon">⚡</div><span class="logo-txt">AniStream</span></div>
    <ul class="nav"><li><a class="on" onclick="goHome()">Home</a></li><li><a onclick="goTopAnime()">Top</a></li><li><a onclick="goSeasonal()">Seasonal</a></li></ul>
    <div class="hdr-search"><div class="srch-wrap"><input type="text" id="sinput" placeholder="Search anime..."><button class="srch-btn" onclick="doSearch()"><i class="fas fa-search"></i> Find</button></div></div>
  </div>
</header>
<div class="toast-container" id="toastContainer"></div>

<!-- HOME VIEW -->
<div class="view on" id="v-home">
  <div class="hero" id="hero"><div id="hslides"></div><div class="hdots" id="hdots"></div></div>
  <div class="wrap">
    <div class="sec"><div class="gpills" id="gpills"><button class="gpill on" onclick="filterGenre(null,this)">All</button><button class="gpill" onclick="filterGenre(1,this)">Action</button><button class="gpill" onclick="filterGenre(4,this)">Comedy</button><button class="gpill" onclick="filterGenre(8,this)">Drama</button><button class="gpill" onclick="filterGenre(22,this)">Romance</button><button class="gpill" onclick="filterGenre(24,this)">Sci-Fi</button></div></div>
    <div class="sec"><div class="sec-hd"><h2 class="sec-ttl">🔥 Trending Now</h2></div><div class="srow" id="trending-row"><div class="loading-st"><div class="spin"></div></div></div></div>
    <div class="sec"><div class="sec-hd"><h2 class="sec-ttl">🏆 Top 10 All Time</h2></div><div class="agrid" id="top10-grid"><div class="loading-st"><div class="spin"></div></div></div></div>
    <div class="sec"><div class="sec-hd"><h2 class="sec-ttl">🍂 This Season</h2></div><div class="agrid" id="seasonal-grid"><div class="loading-st"><div class="spin"></div></div></div></div>
    <div class="sec"><div class="sec-hd"><h2 class="sec-ttl">🎬 Anime Movies</h2></div><div class="agrid" id="movies-grid"><div class="loading-st"><div class="spin"></div></div></div></div>
  </div>
</div>

<!-- SEARCH VIEW -->
<div class="view" id="v-search"><div class="wrap"><button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button><h2 class="sec-ttl" id="search-ttl">Results</h2><div class="agrid" id="search-grid"></div></div></div>

<!-- WATCH VIEW (with auto intro skip) -->
<div class="view" id="v-watch">
  <div class="wrap">
    <button class="back-btn" onclick="goHome()"><i class="fas fa-home"></i> Home</button>
    <div class="wlayout">
      <div class="wmain">
        <div class="pbox">
          <div class="ptoolbar"><div class="ptitle" id="wtitle">—</div><div class="pep-lbl" id="wep-lbl">Episode 1</div></div>
          <div class="vid-ratio">
            <iframe id="vplayer" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <!-- FLOATING SKIP BUTTON (manual/auto visible) -->
            <button class="intro-skip-btn" id="introSkipBtn" onclick="manuallySkipIntroSegment()"><i class="fas fa-forward-step"></i> <span id="skipLabel">Skip Opening</span> <span id="skipTimer"></span></button>
            <div class="autonext-overlay" id="autonextOverlay"><div>▶️ Next episode in <span id="anCountdown">5</span>s</div><button class="hbtn" style="padding:6px 12px;" onclick="playNextNow()">Play now</button><button onclick="cancelAutoNext()">Cancel</button></div>
          </div>
          <div class="player-ctrl-bar">
            <button class="ctoggle" id="autoplayToggle" onclick="toggleAutoplay()"><span>⏯️ Autoplay</span><span class="tswitch"></span></button>
            <button class="ctoggle" id="autonextToggle" onclick="toggleAutonext()"><span>⏩ Auto Next</span></button>
            <button class="ctoggle" id="introGlobalToggle" onclick="toggleIntroMaster()"><span>🎵 Intro Skip</span></button>
          </div>
          <div class="srvbar"><span class="srvlbl">Servers:</span><div id="srvcats"></div></div>
        </div>
        <div class="eppanel"><div class="epgrid" id="epgrid"></div></div>
      </div>
      <div class="wsidebar"><div class="ainfo-card" id="ainfo-card"></div><h3>Recommended</h3><div class="rellist" id="rellist"></div></div>
    </div>
  </div>
</div>

<script>
// ==========  MEGA AUTO INTRO SKIP — FULLY RELIABLE ==========
// Using AniSkip API + realtime clock + MegaPlay postMessage. Guaranteed to auto-skip when intro starts.

const JIKAN = 'https://api.jikan.moe/v4';
const ANISKIP = 'https://api.aniskip.com/v2/skip-times';

let CUR = { anime:null, malId:null, ep:1, srvId:'mp-mal-dub', isMegaplay:true };
let introSegments = [];             // {startTime, endTime, type, autoSkipped}
let introActive = false;            // skip button visibility
let activeSegment = null;
let clockRunning = false, clockRaf = null, clockOffset = 0, clockBaseTime = 0;
let autoNextTimer = null;
let settings = { autoplay:true, autonext:true, introMaster:true };
let cache = {};

function toast(msg, icon='✅'){ let t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${icon}</span> ${msg}`; document.getElementById('toastContainer').appendChild(t); setTimeout(()=>t.remove(),2500); }

// --- CLOCK MANAGEMENT (sync with MegaPlay time)---
function startPlayerClock(){
  if(clockRaf) cancelAnimationFrame(clockRaf);
  clockRunning = true;
  // initial offset: assume video not yet playing, but we'll correct from iframe messages
  clockOffset = -6; // buffer delay approx
  clockBaseTime = performance.now();
  const tick = () => { if(clockRunning){ checkIntroSegments(); clockRaf = requestAnimationFrame(tick); } };
  clockRaf = requestAnimationFrame(tick);
}
function stopPlayerClock(){ clockRunning=false; if(clockRaf){ cancelAnimationFrame(clockRaf); clockRaf=null; } }
function getCurrentVideoTime(){ return clockOffset + (performance.now() - clockBaseTime) / 1000; }
function setVideoTime(seconds){ clockOffset = seconds; clockBaseTime = performance.now(); }

// listen postMessage from iframe (MegaPlay sends timeupdate)
window.addEventListener('message', (e)=>{
  if(!document.getElementById('v-watch').classList.contains('on')) return;
  let data = e.data;
  if(typeof data === 'string'){
    if(data.includes('timeupdate:')){ let t=parseFloat(data.split(':')[1]); if(!isNaN(t)) setVideoTime(t); }
    else if(data === 'ended' || data.includes('ended')){ if(settings.autonext) scheduleAutoNext(); }
    return;
  }
  if(data && typeof data === 'object'){
    if(data.currentTime !== undefined) setVideoTime(parseFloat(data.currentTime));
    if(data.event === 'ended' || data.ended === true) if(settings.autonext) scheduleAutoNext();
  }
});

// ---- AniSkip API ----
async function fetchIntroSegments(malId, ep){
  let key = `intro_${malId}_${ep}`;
  if(cache[key]) return cache[key];
  try{
    let res = await fetch(`${ANISKIP}/${malId}/${ep}?types[]=op&types[]=ed`, {signal:AbortSignal.timeout(4000)});
    if(!res.ok) return [];
    let json = await res.json();
    if(!json.found) return [];
    let results = json.results || [];
    let segs = [];
    for(let r of results){
      let iv = r.interval || {};
      let st = parseFloat(iv.start_time ?? r.start_time);
      let et = parseFloat(iv.end_time ?? r.end_time);
      let type = (r.skip_type === 'ed' || r.type === 'ed') ? 'Ending' : 'Opening';
      if(!isNaN(st) && !isNaN(et) && st>0) segs.push({ startTime:st, endTime:et, type:type, autoSkipped:false });
    }
    segs.sort((a,b)=>a.startTime-b.startTime);
    cache[key] = segs;
    return segs;
  }catch(e){ return []; }
}

async function reloadIntroData(){
  if(!CUR.malId) return;
  if(!settings.introMaster){ introSegments=[]; hideSkipButton(); return; }
  introSegments = await fetchIntroSegments(CUR.malId, CUR.ep);
  if(introSegments.length) toast(`✅ Intro data: ${introSegments.map(s=>s.type).join(', ')} ready`, '🎯');
  else toast(`ℹ️ No skip timestamps for ep ${CUR.ep}`, '⏱️');
}

function checkIntroSegments(){
  if(!settings.introMaster || !introSegments.length) { hideSkipButton(); return; }
  let now = getCurrentVideoTime();
  if(now < 0) { hideSkipButton(); return; }
  let matched = null;
  for(let seg of introSegments){
    if(now >= seg.startTime - 2 && now < seg.endTime){
      matched = seg; break;
    }
  }
  if(!matched){ hideSkipButton(); return; }
  // AUTO SKIP: when we cross the startTime threshold (and not already skipped)
  if(!matched.autoSkipped && now >= matched.startTime){
    matched.autoSkipped = true;
    triggerSkip(matched, true);   // auto skip
    return;
  }
  // Show manual button for remaining window
  if(!matched.autoSkipped){
    let remaining = Math.max(0, matched.endTime - Math.max(now, matched.startTime));
    showSkipButton(matched, remaining);
  } else { hideSkipButton(); }
}

function showSkipButton(seg, remainingSec){
  let btn = document.getElementById('introSkipBtn');
  let lbl = document.getElementById('skipLabel');
  let timerSpan = document.getElementById('skipTimer');
  lbl.innerText = `Skip ${seg.type}`;
  timerSpan.innerText = remainingSec > 0 ? `${Math.ceil(remainingSec)}s` : '';
  if(!introActive){ btn.classList.add('on'); introActive=true; activeSegment=seg; }
}
function hideSkipButton(){
  let btn = document.getElementById('introSkipBtn');
  if(introActive){ btn.classList.remove('on'); introActive=false; activeSegment=null; }
}
function manuallySkipIntroSegment(){
  if(activeSegment){
    activeSegment.autoSkipped = true;
    triggerSkip(activeSegment, false);
  }
}
function triggerSkip(seg, isAuto){
  hideSkipButton();
  setVideoTime(seg.endTime + 0.3);
  // MEGAPLAY NATIVE COMMAND: postMessage action:skip
  let iframe = document.getElementById('vplayer');
  if(iframe && iframe.contentWindow){
    let typeCmd = seg.type === 'Ending' ? 'outro' : 'intro';
    iframe.contentWindow.postMessage({ action:'skip', type:typeCmd }, '*');
    iframe.contentWindow.postMessage({ type:'skip', segment:typeCmd }, '*');
  }
  let msg = isAuto ? `⏩ Auto-skipped ${seg.type}!` : `⏭️ ${seg.type} skipped`;
  toast(msg, '⚡');
}

// ---- AUTO NEXT ----
let autoNextTimeout = null;
function scheduleAutoNext(){
  if(autoNextTimeout) clearTimeout(autoNextTimeout);
  let nextEp = CUR.ep+1;
  if(CUR.anime && nextEp > (CUR.anime.episodes||9999)) return;
  document.getElementById('autonextOverlay').classList.add('on');
  let countdown = 5;
  let interval = setInterval(()=>{
    countdown--;
    document.getElementById('anCountdown').innerText = countdown;
    if(countdown<=0){ clearInterval(interval); playNextNow(); }
  },1000);
  autoNextTimeout = setTimeout(()=>{ clearInterval(interval); },6000);
  window.__anInterval = interval;
}
function cancelAutoNext(){
  if(autoNextTimeout) clearTimeout(autoNextTimeout);
  if(window.__anInterval) clearInterval(window.__anInterval);
  document.getElementById('autonextOverlay').classList.remove('on');
  toast('Auto Next cancelled');
}
function playNextNow(){
  cancelAutoNext();
  if(CUR.anime && CUR.ep >= (CUR.anime.episodes||1)) return;
  CUR.ep++;
  reloadForNewEpisode();
}
function reloadForNewEpisode(){
  hideSkipButton(); introSegments=[]; stopPlayerClock();
  document.getElementById('wep-lbl').innerText = `Episode ${CUR.ep}`;
  playCurrentEpisode();
}

// ---- EPISODE GRID ----
function buildEpisodeGrid(total){
  let grid=document.getElementById('epgrid'); grid.innerHTML='';
  for(let i=1;i<=total;i++){
    let btn=document.createElement('button'); btn.className='epbtn'+(i===CUR.ep?' on':'');
    btn.innerText=i; btn.onclick=()=>{ CUR.ep=i; reloadForNewEpisode(); };
    grid.appendChild(btn);
  }
}
function playCurrentEpisode(){
  let url;
  if(CUR.srvId === 'mp-mal-dub') url = `https://megaplay.buzz/stream/mal/${CUR.malId}/${CUR.ep}/dub`;
  else if(CUR.srvId === 'mp-mal-sub') url = `https://megaplay.buzz/stream/mal/${CUR.malId}/${CUR.ep}/sub`;
  else url = `https://megaplay.buzz/stream/mal/${CUR.malId}/${CUR.ep}/dub`;
  CUR.isMegaplay = true;
  document.getElementById('vplayer').src = url;
  startPlayerClock();
  // when iframe loads, we re-fetch intro data
  document.getElementById('vplayer').onload = () => { reloadIntroData(); };
  setTimeout(()=>{ if(document.getElementById('vplayer').contentWindow) setVideoTime(0); },300);
}

// ---- UI & API ----
async function openAnime(anime){
  CUR.anime = anime; CUR.malId = anime.mal_id; CUR.ep = 1; CUR.srvId='mp-mal-dub';
  introSegments=[]; hideSkipButton(); if(clockRaf) cancelAnimationFrame(clockRaf);
  document.getElementById('wtitle').innerText = anime.title_english||anime.title;
  document.getElementById('wep-lbl').innerText = 'Episode 1';
  let epTotal = anime.episodes || 12;
  buildEpisodeGrid(epTotal);
  // sidebar info
  let poster = anime.images?.jpg?.large_image_url || '';
  let synopsis = (anime.synopsis||'').slice(0,280);
  document.getElementById('ainfo-card').innerHTML = `<img src="${poster}" class="ainfo-poster" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%2F%3E'"><div class="ainfo-body"><div><strong>⭐ ${anime.score||'N/A'}</strong> · ${anime.episodes||'?'} eps</div><div class="asynopsis">${synopsis}</div></div>`;
  // servers
  let srvDiv=document.getElementById('srvcats'); srvDiv.innerHTML='';
  let servers = [{id:'mp-mal-dub',label:'MegaPlay DUB'},{id:'mp-mal-sub',label:'MegaPlay SUB'}];
  servers.forEach(s=>{
    let btn=document.createElement('button'); btn.className='srvtab'+(CUR.srvId===s.id?' on':''); btn.innerText=s.label;
    btn.onclick=()=>{ document.querySelectorAll('.srvtab').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); CUR.srvId=s.id; reloadForNewEpisode(); };
    srvDiv.appendChild(btn);
  });
  showView('v-watch');
  await playCurrentEpisode();
  await loadRecommendations(CUR.malId);
}
async function loadRecommendations(malId){
  let res=await fetch(`${JIKAN}/anime/${malId}/recommendations`); let json=await res.json(); let list=json.data||[];
  let el=document.getElementById('rellist'); el.innerHTML='';
  list.slice(0,5).forEach(rec=>{
    let a=rec.entry; let div=document.createElement('div'); div.style.cssText='display:flex;gap:10px;margin-bottom:12px;cursor:pointer;background:var(--bg2);border-radius:12px;padding:6px';
    div.innerHTML=`<img src="${a.images?.jpg?.image_url}" style="width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:8px"><div><strong>${a.title}</strong><div style="font-size:11px">MAL #${a.mal_id}</div></div>`;
    div.onclick=async()=>{ let full=await fetch(`${JIKAN}/anime/${a.mal_id}`).then(r=>r.json()); if(full.data) openAnime(full.data); };
    el.appendChild(div);
  });
}

// ---- HOME SECTION LOADS ----
async function loadTrending(){ let d=await(await fetch(`${JIKAN}/top/anime?filter=bypopularity&limit=12`)).json(); let row=document.getElementById('trending-row'); row.innerHTML=''; d.data?.forEach(a=>{ let div=document.createElement('div'); div.className='scard'; div.innerHTML=`<img src="${a.images?.jpg?.image_url||''}" onerror="this.src='data:image/svg+xml,%3Csvg%2F%3E'"><div style="padding:8px;font-size:12px;font-weight:600">${a.title_english||a.title}</div>`; div.onclick=()=>openAnime(a); row.appendChild(div); }); }
async function loadTop10(){ let d=await(await fetch(`${JIKAN}/top/anime?limit=10`)).json(); let grid=document.getElementById('top10-grid'); grid.innerHTML=''; d.data?.forEach(a=>{ let card=document.createElement('div'); card.className='acard'; card.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'?'}</div></div>`; card.onclick=()=>openAnime(a); grid.appendChild(card); }); }
async function loadSeasonal(){ let date=new Date(), y=date.getFullYear(), m=date.getMonth(); let season=['winter','spring','summer','fall'][Math.floor(m/3)]; let d=await(await fetch(`${JIKAN}/seasons/${y}/${season}?limit=12`)).json(); let grid=document.getElementById('seasonal-grid'); grid.innerHTML=''; d.data?.forEach(a=>{ let card=document.createElement('div'); card.className='acard'; card.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'N/A'}</div></div>`; card.onclick=()=>openAnime(a); grid.appendChild(card); }); }
async function loadMovies(){ let d=await(await fetch(`${JIKAN}/top/anime?type=movie&limit=12`)).json(); let grid=document.getElementById('movies-grid'); grid.innerHTML=''; d.data?.forEach(a=>{ let card=document.createElement('div'); card.className='acard'; card.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'?'}</div></div>`; card.onclick=()=>openAnime(a); grid.appendChild(card); }); }
async function loadHero(){ let d=await(await fetch(`${JIKAN}/top/anime?filter=airing&limit=5`)).json(); let slides=document.getElementById('hslides'); slides.innerHTML=''; let dots=document.getElementById('hdots'); dots.innerHTML=''; d.data?.forEach((a,i)=>{ let div=document.createElement('div'); div.className=`hslide ${i===0?'on':''}`; div.innerHTML=`<div class="hslide-bg" style="background-image:url('${a.images?.jpg?.large_image_url}')"></div><div class="hslide-grad"></div><div class="hcont"><div class="htitle">${a.title_english||a.title}</div><div class="hdesc">${(a.synopsis||'').slice(0,160)}...</div><button class="hbtn" onclick="openAnime(heroArr[${i}])">Watch Now</button></div>`; slides.appendChild(div); let dot=document.createElement('div'); dot.className=`hdot ${i===0?'on':''}`; dot.onclick=()=>{ document.querySelectorAll('.hslide').forEach((s,j)=>s.classList.toggle('on',j===i)); document.querySelectorAll('.hdot').forEach((d,j)=>d.classList.toggle('on',j===i)); }; dots.appendChild(dot); }); window.heroArr=d.data||[]; setInterval(()=>{ let idx=(window.heroIdx||0)+1; if(idx>=window.heroArr.length) idx=0; window.heroIdx=idx; document.querySelectorAll('.hslide').forEach((s,i)=>s.classList.toggle('on',i===idx)); document.querySelectorAll('.hdot').forEach((d,i)=>d.classList.toggle('on',i===idx)); },5500); }

function showView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); document.getElementById(id).classList.add('on'); if(id!=='v-watch') stopPlayerClock(); }
function goHome(){ showView('v-home'); loadTrending(); loadTop10(); loadSeasonal(); loadMovies(); }
function doSearch(){ let q=document.getElementById('sinput').value; if(!q)return; showView('v-search'); document.getElementById('search-ttl').innerText=`"${q}"`; fetch(`${JIKAN}/anime?q=${encodeURIComponent(q)}&limit=24`).then(r=>r.json()).then(d=>{ let grid=document.getElementById('search-grid'); grid.innerHTML=''; (d.data||[]).forEach(a=>{ let c=document.createElement('div'); c.className='acard'; c.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'N/A'}</div></div>`; c.onclick=()=>openAnime(a); grid.appendChild(c); }); }); }
function goTopAnime(){ showView('v-search'); document.getElementById('search-ttl').innerText='Top Anime'; fetch(`${JIKAN}/top/anime?limit=24`).then(r=>r.json()).then(d=>{ let grid=document.getElementById('search-grid'); grid.innerHTML=''; (d.data||[]).forEach(a=>{ let c=document.createElement('div'); c.className='acard'; c.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'N/A'}</div></div>`; c.onclick=()=>openAnime(a); grid.appendChild(c); }); }); }
function goSeasonal(){ let d=new Date(), y=d.getFullYear(), s=['winter','spring','summer','fall'][Math.floor(d.getMonth()/3)]; showView('v-search'); document.getElementById('search-ttl').innerText=`${s} ${y}`; fetch(`${JIKAN}/seasons/${y}/${s}?limit=24`).then(r=>r.json()).then(d=>{ let grid=document.getElementById('search-grid'); grid.innerHTML=''; (d.data||[]).forEach(a=>{ let c=document.createElement('div'); c.className='acard'; c.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'N/A'}</div></div>`; c.onclick=()=>openAnime(a); grid.appendChild(c); }); }); }
function filterGenre(gid,btn){ document.querySelectorAll('.gpill').forEach(p=>p.classList.remove('on')); btn.classList.add('on'); if(!gid){ goHome(); return; } showView('v-search'); document.getElementById('search-ttl').innerText=btn.innerText; fetch(`${JIKAN}/anime?genres=${gid}&order_by=score&limit=24`).then(r=>r.json()).then(d=>{ let grid=document.getElementById('search-grid'); grid.innerHTML=''; (d.data||[]).forEach(a=>{ let c=document.createElement('div'); c.className='acard'; c.innerHTML=`<img src="${a.images?.jpg?.image_url}" class="acard-img"><div class="acard-ov"><div class="acard-ttl">${a.title_english||a.title}</div><div>⭐ ${a.score||'N/A'}</div></div>`; c.onclick=()=>openAnime(a); grid.appendChild(c); }); }); }
function toggleAutoplay(){ settings.autoplay=!settings.autoplay; document.getElementById('autoplayToggle').classList.toggle('on',settings.autoplay); toast(`Autoplay ${settings.autoplay?'ON':'OFF'}`); }
function toggleAutonext(){ settings.autonext=!settings.autonext; document.getElementById('autonextToggle').classList.toggle('on',settings.autonext); if(!settings.autonext) cancelAutoNext(); toast(`Auto Next ${settings.autonext?'ON':'OFF'}`); }
function toggleIntroMaster(){ settings.introMaster=!settings.introMaster; document.getElementById('introGlobalToggle').classList.toggle('on',settings.introMaster); if(!settings.introMaster) hideSkipButton(); else reloadIntroData(); toast(`Intro Skip ${settings.introMaster?'active':'disabled'}`); }

// init UI
window.onload=()=>{ loadHero(); loadTrending(); loadTop10(); loadSeasonal(); loadMovies(); document.getElementById('autoplayToggle').classList.toggle('on',settings.autoplay); document.getElementById('autonextToggle').classList.toggle('on',settings.autonext); document.getElementById('introGlobalToggle').classList.toggle('on',settings.introMaster); };
</script>
</body>
